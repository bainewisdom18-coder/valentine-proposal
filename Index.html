<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Love 💖</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(to bottom, #ffe6f0, #ffb3d1);
      color: #800040;
    }

    .container {
      padding: 50px 20px;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 20px;
      color: #d1005b;
    }

    p {
      font-size: 1.5em;
      margin-bottom: 40px;
    }

    .heart {
      font-size: 5em;
      color: #ff1a8c;
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .btn {
      display: inline-block;
      padding: 15px 30px;
      background: #ff1a8c;
      color: white;
      text-decoration: none;
      font-size: 1.5em;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="heart">❤️</div>
    <h1>My Double Princess</h1>
    <p>You make my world brighter every day.<br>Will you be my Valentine?</p>
    <a class="btn" href="https://wa.me/234XXXXXXXXXX?text=Yes%20I%20will%20be%20your%20Valentine💖" target="_blank">
      Say Yes 💌
    </a>
  </div>
</body>
</html>
